[package]
name = "hashall"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "A simple CLI tool to hash all files in a directory (and files in the archive files)."

authors = ["Yuki SUZUKI <y-suzuki@radiol.med.osaka-u.ac.jp>"]
repository = "https://github.com/ykszk/hashall"

[dependencies]
anyhow = "1.0.86"
bzip2 = "0.4.4"
clap = { version = "4.5.10", features = ["derive", "color"] }
digest = "0.10.7"
env_logger = "0.11.4"
flate2 = "1.0.30"
indicatif = "0.17.8"
log = "0.4.22"
md-5 = "0.10.6"
parse-size = "1.0.0"
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
tar = "0.4.41"
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = "2.1.5"
zstd = "0.13.2"

[dev-dependencies]
assert_cmd = "2.0.14"
pretty_assertions = "1.4.0"
